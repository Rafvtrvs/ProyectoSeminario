# Taxonomía v1 del sistema de asistencia
# IDs fijos: no reordenar sin regenerar etiquetas

names:
  0: persona
  1: poste_luz
  2: senal_stop
  3: senal_transito

# Mapeo desde clases originales (nombres exactos de cada data.yaml)
sources:
  pedestrian:
    folder: data/raw/pedestrian
    note: "Sin carpeta valid/ en el zip; train+test solamente"
    map:
      person: persona

  street_signs:
    folder: data/raw/street_signs
    map:
      stop: senal_stop
      speedlimit: senal_transito
    ignore:
      - crosswalk
      - trafficlight

  lamp_post:
    folder: data/raw/lamp_post
    map:
      "lamp post": poste_luz

  stop:
    folder: data/raw/stop
    note: "lisa stop-b7t6s; names ['0','1'] en data.yaml"
    map:
      "0": senal_stop
    ignore:
      - "1"

  stop_sing:
    folder: data/raw/stop_sing
    note: "stop-sign-shg06 (~2645 imgs)"
    map:
      "Stop-Sign - v3 2023-05-23 10-52am": senal_stop

  stop_signal:
    folder: data/raw/stop_signal
    map:
      stop: senal_stop
    ignore:
      - green
      - red
      - semaforo

  traffic_stop:
    folder: data/raw/traffic_stop
    note: "traffic-and-road-signs; solo Stop_Sign"
    map:
      Stop_Sign: senal_stop
    ignore:
      - "-Road narrows on right"
      - "50 mph speed limit"
      - "Attention Please-"
      - "Beware of children"
      - "CYCLE ROUTE AHEAD WARNING"
      - "Dangerous Left Curve Ahead"
      - "Dangerous Rright Curve Ahead"
      - "End of all speed and passing limits"
      - "Give Way"
      - "Go Straight or Turn Right"
      - "Go straight or turn left"
      - "Keep-Left"
      - "Keep-Right"
      - "Left Zig Zag Traffic"
      - "No Entry"
      - "No_Over_Taking"
      - "Overtaking by trucks is prohibited"
      - "Pedestrian Crossing"
      - "Round-About"
      - "Slippery Road Ahead"
      - "Speed Limit 20 KMPh"
      - "Speed Limit 30 KMPh"
      - "Straight Ahead Only"
      - "Traffic_signal"
      - "Truck traffic is prohibited"
      - "Turn left ahead"
      - "Turn right ahead"
      - "Uneven Road"
